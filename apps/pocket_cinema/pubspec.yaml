name: pocket_cinema
description: Local-first Android media library risk spike.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  media_domain: ^1.0.0
  media_parser: ^1.0.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  media_platform_storage: ^1.0.0
  media_playback: ^1.0.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.7
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/



  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
