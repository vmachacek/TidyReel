<!-- Micro-interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const playPauseBtn = document.getElementById('btn-playpause');
      let isPlaying = true;

      if (playPauseBtn) {
        playPauseBtn.addEventListener('click', () => {
          isPlaying = !isPlaying;
          const icon = playPauseBtn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause Video' : 'Play Video');
          }
        });
      }

      // Close Up Next banner
      const cancelNextBtn = document.getElementById('btn-cancel-next');
      if (cancelNextBtn) {
        cancelNextBtn.addEventListener('click', (e) => {
          const banner = e.target.closest('aside');
          if (banner) {
            banner.style.transition = 'all 0.25s ease-out';
            banner.style.opacity = '0';
            banner.style.transform = 'translateY(12px)';
            setTimeout(() => banner.remove(), 250);
          }
        });
      }

      // Rewind / Forward button feedback
      const rewindBtn = document.getElementById('btn-rewind');
      const forwardBtn = document.getElementById('btn-forward');

      const triggerRipple = (btn) => {
        btn.classList.add('ring-2', 'ring-primary/60');
        setTimeout(() => btn.classList.remove('ring-2', 'ring-primary/60'), 220);
      };

      if (rewindBtn) rewindBtn.addEventListener('click', () => triggerRipple(rewindBtn));
      if (forwardBtn) forwardBtn.addEventListener('click', () => triggerRipple(forwardBtn));
    });
  </script>
